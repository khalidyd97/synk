    <rect x="16" y="28" width="24" height="10" rx="2" fill="#ffffff" stroke="#ff2cdf" stroke-width="2" filter="url(#magGlowIcon)" />
    <rect x="43" y="50" width="24" height="10" rx="2" fill="#ffffff" stroke="#ff2cdf" stroke-width="2" filter="url(#magGlowIcon)" />
