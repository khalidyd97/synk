<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <filter id="cyanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <linearGradient id="metalFrameCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8ebf2" />
      <stop offset="25%" stop-color="#3b6978" />
      <stop offset="50%" stop-color="#1b262c" />
      <stop offset="75%" stop-color="#204051" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="innerBgCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051824" />
      <stop offset="50%" stop-color="#072235" />
      <stop offset="100%" stop-color="#020c14" />
    </linearGradient>

    <linearGradient id="playIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#70f5ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="textMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#d9faff" />
      <stop offset="60%" stop-color="#7da8b8" />
      <stop offset="100%" stop-color="#e0fbfc" />
    </linearGradient>

    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Top & Bottom Audio Equalizer Waves -->
  <g fill="#00f2fe" opacity="0.75" filter="url(#cyanGlow)">
    <rect x="140" y="32" width="4" height="28" rx="2" />
    <rect x="148" y="18" width="4" height="42" rx="2" />
    <rect x="156" y="38" width="4" height="22" rx="2" />
    <rect x="164" y="10" width="4" height="50" rx="2" />
    <rect x="172" y="25" width="4" height="35" rx="2" />
    <rect x="180" y="40" width="4" height="20" rx="2" />
    <rect x="188" y="30" width="4" height="30" rx="2" />
    <rect x="196" y="15" width="4" height="45" rx="2" />
    <rect x="204" y="35" width="4" height="25" rx="2" />
    <rect x="212" y="28" width="4" height="32" rx="2" />
    <rect x="220" y="42" width="4" height="18" rx="2" />
    <rect x="228" y="20" width="4" height="40" rx="2" />
    <rect x="236" y="34" width="4" height="26" rx="2" />
    <rect x="244" y="12" width="4" height="48" rx="2" />
    <rect x="252" y="30" width="4" height="30" rx="2" />
    <rect x="260" y="40" width="4" height="20" rx="2" />
    <rect x="268" y="22" width="4" height="38" rx="2" />
    <rect x="276" y="36" width="4" height="24" rx="2" />
    <rect x="284" y="26" width="4" height="34" rx="2" />
    <rect x="292" y="44" width="4" height="16" rx="2" />
    <rect x="150" y="320" width="4" height="35" rx="2" />
    <rect x="158" y="320" width="4" height="20" rx="2" />
    <rect x="166" y="320" width="4" height="48" rx="2" />
    <rect x="174" y="320" width="4" height="28" rx="2" />
    <rect x="182" y="320" width="4" height="15" rx="2" />
    <rect x="190" y="320" width="4" height="38" rx="2" />
    <rect x="198" y="320" width="4" height="22" rx="2" />
    <rect x="206" y="320" width="4" height="42" rx="2" />
    <rect x="214" y="320" width="4" height="30" rx="2" />
    <rect x="222" y="320" width="4" height="18" rx="2" />
    <rect x="230" y="320" width="4" height="34" rx="2" />
    <rect x="238" y="320" width="4" height="25" rx="2" />
    <rect x="246" y="320" width="4" height="45" rx="2" />
    <rect x="254" y="320" width="4" height="20" rx="2" />
    <rect x="262" y="320" width="4" height="32" rx="2" />
    <rect x="270" y="320" width="4" height="16" rx="2" />
    <rect x="278" y="320" width="4" height="28" rx="2" />
  </g>

  <!-- Outer Heavy Mecha Armor Frame -->
  <g filter="url(#softShadow)">
    <polygon points="75,55 480,55 495,68 615,68 645,98 645,282 615,312 495,312 480,325 75,325 45,295 45,85" 
             fill="url(#metalFrameCyan)" stroke="#70f5ff" stroke-width="2" />
    <polygon points="40,110 58,95 58,72 80,52 135,52 125,42 72,42 38,76" fill="#5ce1e6" opacity="0.85" />
    <polygon points="40,270 58,285 58,308 80,328 135,328 125,338 72,338 38,304" fill="#204051" stroke="#00f2fe" stroke-width="1.5" />
    <polygon points="560,58 620,58 654,92 654,140 642,130 642,96 614,68 570,68" fill="#5ce1e6" opacity="0.85" />
    <polygon points="560,322 620,322 654,288 654,240 642,250 642,284 614,312 570,312" fill="#204051" stroke="#00f2fe" stroke-width="1.5" />
  </g>

  <!-- Inner Dark Screen Area -->
  <polygon points="85,72 472,72 487,85 602,85 626,108 626,272 602,295 487,295 472,308 85,308 64,286 64,94" fill="url(#innerBgCyan)" />
  <polygon points="85,72 472,72 487,85 602,85 626,108 626,272 602,295 487,295 472,308 85,308 64,286 64,94" fill="url(#scanlines)" />

  <!-- Glowing Inner Neon Track Line -->
  <polygon points="92,80 468,80 483,93 596,93 616,113 616,267 596,287 483,287 468,300 92,300 74,282 74,98" 
           fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#cyanGlow)" />
  <polygon points="92,80 468,80 483,93 596,93 616,113 616,267 596,287 483,287 468,300 92,300 74,282 74,98" 
           fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9" />

  <!-- HUD Decorative Slashes (Top Right) -->
  <g fill="#00f2fe" opacity="0.8">
    <polygon points="555,102 562,102 554,114 547,114" />
    <polygon points="566,102 573,102 565,114 558,114" />
    <polygon points="577,102 584,102 576,114 569,114" />
    <polygon points="588,102 595,102 587,114 580,114" />
  </g>

  <!-- 3D Beveled Play Triangle Icon -->
  <g filter="url(#cyanGlow)">
    <path d="M 125 110 L 220 168 Q 230 174 220 180 L 125 238 Q 115 244 115 232 L 115 116 Q 115 104 125 110 Z" 
          fill="#004e92" stroke="#00f2fe" stroke-width="4" />
  </g>
  <path d="M 132 122 L 210 170 Q 216 174 210 178 L 132 226 Q 125 230 125 222 L 125 126 Q 125 118 132 122 Z" 
        fill="url(#playIconGrad)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Main Label: PLAY (Vector Path) -->
  

  <!-- Pill Badge: 01 / EXPERIENCE -->
  <g transform="translate(245, 228)">
    <path d="M 10 0 L 180 0 L 190 14 L 180 28 L 10 28 L 0 14 Z" fill="#062c43" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
    
  </g>

  <!-- Divider Line -->
  <line x1="95" y1="242" x2="245" y2="242" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
  <line x1="435" y1="242" x2="515" y2="242" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />

  <!-- Subtext: Find your track. Chase your best. -->
  

  <!-- Glowing Double Chevrons (Bottom Right) -->
  <g transform="translate(505, 222)">
    <polyline points="0,12 18,32 0,52" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.25" />
    <polyline points="14,12 32,32 14,52" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.45" />
    <g filter="url(#cyanGlow)">
      <path d="M 32 8 L 56 32 L 32 56 L 42 56 L 66 32 L 42 8 Z" fill="#70f5ff" stroke="#ffffff" stroke-width="1" />
      <path d="M 55 8 L 79 32 L 55 56 L 65 56 L 89 32 L 65 8 Z" fill="#ffffff" stroke="#00f2fe" stroke-width="1.5" />
    </g>
  </g>
</svg>