name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [codex/unsigned-ios]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          cp -R /tmp/templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"
      - name: Export Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/ios-unsigned
          python3 - <<'PY'
          from pathlib import Path
          p=Path('export_presets.cfg')
          text=p.read_text().replace('[preset.2.options]', '[preset.2.options]\napplication/app_store_team_id="0000000000"')
          p.write_text(text)
          PY
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --editor --path . --import
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release iOS builds/ios-unsigned/SYNK.zip
          if ! find builds/ios-unsigned -name '*.xcodeproj' | grep -q .; then
            unzip -q builds/ios-unsigned/SYNK.zip -d builds/ios-unsigned/project
          fi
      - name: Build device app without signing
        shell: bash
        run: |
          set -euo pipefail
          project=$(find builds/ios-unsigned -name '*.xcodeproj' -print -quit)
          scheme=$(/usr/libexec/PlistBuddy -c 'Print :project:schemes:0' /dev/null 2>/dev/null || true)
          scheme=$(xcodebuild -list -json -project "$project" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$project" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath builds/ios-derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          app=$(find builds/ios-derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p builds/ipa/Payload
          cp -R "$app" builds/ipa/Payload/SYNK.app
          cd builds/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload SYNK-unsigned.ipa
          unzip -t SYNK-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SYNK-unsigned-IPA
          path: builds/ipa/SYNK-unsigned.ipa
      - name: Publish unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ios-unsigned-${{ github.run_id }}" builds/ipa/SYNK-unsigned.ipa --prerelease --title 'SYNK unsigned iOS test build' --notes 'Unsigned device IPA. Sign with your own signing tool before installing.'
